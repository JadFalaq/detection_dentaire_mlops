name: CD — Build, Test & Deploy

on:
  push:
    branches: ["main", "master"]
  workflow_run:
    workflows: ["CI — Tests et Vérifications"]
    types: [completed]
    branches: ["main", "master"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: dental-detection-api
  REGISTRY: ghcr.io
  RAILWAY_URL: https://detectiondentairemlops-production.up.railway.app

jobs:
  # ── Guard : CD ne tourne que si CI est vert ────────────────────────────────
  check-ci:
    name: Check CI Status
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - name: Check if CI passed
        id: check
        run: |
          # Si déclenché par workflow_run, vérifie le statut
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
              echo "should_run=true" >> $GITHUB_OUTPUT
              echo "CI passed - proceeding with CD"
            else
              echo "should_run=false" >> $GITHUB_OUTPUT
              echo "CI failed - skipping CD"
            fi
          else
            # Déclenché par push direct - on continue
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Direct push - proceeding with CD"
          fi

  # ── Build de l'image Docker ────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: check-ci
    if: needs.check-ci.outputs.should_run == 'true'
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Building image with tag: ${SHORT_SHA}"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as artifact
        run: docker save ${{ env.IMAGE_NAME }}:latest | gzip > /tmp/docker-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ steps.meta.outputs.version }}
          path: /tmp/docker-image.tar.gz
          retention-days: 1

  # ── Tests d'intégration du service ────────────────────────────────────────
  integration-tests:
    name: Integration Tests (Service Endpoints)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ needs.build.outputs.image_tag }}
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/docker-image.tar.gz

      - name: Start service container
        run: |
          docker run -d \
            --name dental-api \
            -p 8000:8000 \
            ${{ env.IMAGE_NAME }}:latest
          echo "Container started"

      - name: Wait for service ready
        run: |
          echo "Waiting for service..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Service ready after ${i}s"
              break
            fi
            sleep 2
          done

      - name: Test GET / — root endpoint
        run: |
          RESPONSE=$(curl -sf http://localhost:8000/)
          echo "$RESPONSE"
          echo "$RESPONSE" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert 'message' in d and 'predict' in d
          print('PASS: GET /')
          "

      - name: Test GET /health — service health
        run: |
          RESPONSE=$(curl -sf http://localhost:8000/health)
          echo "$RESPONSE"
          echo "$RESPONSE" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['status'] == 'ok', f'Expected ok, got {d[\"status\"]}'
          assert d['service'] == 'dental-detection-api'
          assert d['checkpoint_exists'] == True, 'Checkpoint missing!'
          print(f'PASS: /health — model={d[\"model_name\"]}, checkpoint={d[\"checkpoint_exists\"]}')
          "

      - name: Test GET /model-info — model metadata
        run: |
          RESPONSE=$(curl -sf http://localhost:8000/model-info)
          echo "$RESPONSE"
          echo "$RESPONSE" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert 'model_name' in d
          assert d['checkpoint_exists'] == True
          print(f'PASS: /model-info — model={d[\"model_name\"]}')
          "

      - name: Test GET /docs — Swagger UI
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/docs)
          [ "$STATUS" = "200" ] && echo "PASS: /docs returns 200" || (echo "FAIL: /docs returned $STATUS" && exit 1)

      - name: Test POST /predict — inference endpoint reachable
        run: |
          # Créer une image JPEG minimale de test
          python3 -c "
          import base64, os
          os.makedirs('tests/fixtures', exist_ok=True)
          jpeg = ''
          with open('tests/fixtures/test.jpg', 'wb') as f:
              f.write(base64.b64decode(jpeg))
          "
          STATUS=$(curl -s -o /tmp/predict_out.json -w "%{http_code}" \
            -X POST http://localhost:8000/predict \
            -F "file=@tests/fixtures/test.jpg")
          cat /tmp/predict_out.json
          [ "$STATUS" = "200" ] && echo "PASS: POST /predict returned 200" || \
          [ "$STATUS" = "500" ] && echo "INFO: POST /predict returned 500 (no real model loaded, expected)" || \
          (echo "FAIL: POST /predict returned $STATUS" && exit 1)

      - name: Container logs
        if: always()
        run: docker logs dental-api

      - name: Cleanup container
        if: always()
        run: docker rm -f dental-api || true

  # ── Vérification du déploiement Railway en production ─────────────────────
  verify-production:
    name: Verify Production Deployment
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - name: Health check production backend
        run: |
          echo "Checking Railway backend..."
          RESPONSE=$(curl -sf ${{ env.RAILWAY_URL }}/health)
          echo "$RESPONSE"
          echo "$RESPONSE" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['status'] == 'ok'
          assert d['checkpoint_exists'] == True
          print(f'PASS: Production backend healthy — model={d[\"model_name\"]}')
          "

      - name: Health check production frontend
        run: |
          echo "Checking Vercel frontend..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://detection-dentaire-mlops.vercel.app)
          [ "$STATUS" = "200" ] && echo "PASS: Frontend online (HTTP $STATUS)" || \
          (echo "FAIL: Frontend returned HTTP $STATUS" && exit 1)

      - name: Test production /model-info endpoint
        run: |
          RESPONSE=$(curl -sf ${{ env.RAILWAY_URL }}/model-info)
          echo "$RESPONSE"
          echo "$RESPONSE" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['checkpoint_exists'] == True
          print(f'PASS: Production model info — {d[\"model_name\"]} ready')
          "

  # ── Résumé final du pipeline ───────────────────────────────────────────────
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [build, integration-tests, verify-production]
    if: always()

    steps:
      - name: Print summary
        run: |
          echo "=================================================="
          echo "   DENTAL DETECTION — CI/CD PIPELINE SUMMARY"
          echo "=================================================="
          echo ""
          echo "  Build Image        : ${{ needs.build.result }}"
          echo "  Integration Tests  : ${{ needs.integration-tests.result }}"
          echo "  Production Check   : ${{ needs.verify-production.result }}"
          echo ""
          BUILD="${{ needs.build.result }}"
          TESTS="${{ needs.integration-tests.result }}"
          PROD="${{ needs.verify-production.result }}"

          if [ "$BUILD" = "success" ] && [ "$TESTS" = "success" ] && [ "$PROD" = "success" ]; then
            echo "  STATUS : ALL GREEN ✓"
            echo ""
            echo "  Frontend : https://detection-dentaire-mlops.vercel.app"
            echo "  Backend  : https://detectiondentairemlops-production.up.railway.app"
            echo "  API Docs : https://detectiondentairemlops-production.up.railway.app/docs"
            echo "=================================================="
            exit 0
          else
            echo "  STATUS : PIPELINE FAILED ✗"
            echo "=================================================="
            exit 1
          fi
