name: CD — Build, Test & Deploy

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: dental-detection-api
  FRONTEND_URL: https://detection-dentaire-mlops.vercel.app

jobs:
  # ── Job 1 : Tests unitaires (garde du CD) ─────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ci-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: ${{ runner.os }}-pip-ci-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e .

      - name: Run unit tests
        run: |
          pytest \
            tests/test_config.py \
            tests/test_paths.py \
            tests/test_remap.py \
            tests/test_label_parser.py \
            tests/test_registry_utils.py \
            tests/test_api.py \
            -v --tb=short

      - name: Verify CLIs
        run: |
          python scripts/serve_api.py --help
          python scripts/register_best_model.py --help

  # ── Job 2 : Build Docker (dépend de unit-tests) ───────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: unit-tests
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image artifact
        run: docker save ${{ env.IMAGE_NAME }}:latest | gzip > /tmp/docker-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ steps.meta.outputs.version }}
          path: /tmp/docker-image.tar.gz
          retention-days: 1

  # ── Job 3 : Tests d'intégration (dépend de build) ─────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ needs.build.outputs.image_tag }}
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/docker-image.tar.gz

      - name: Start service container
        run: |
          docker run -d --name dental-api -p 8000:8000 ${{ env.IMAGE_NAME }}:latest

      - name: Wait for service ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health > /dev/null 2>&1 && echo "Ready after ${i}s" && break
            sleep 2
          done

      - name: Test GET /
        run: |
          curl -sf http://localhost:8000/ | python3 -c "
          import sys, json; d=json.load(sys.stdin)
          assert 'message' in d; print('PASS: GET /')"

      - name: Test GET /health
        run: |
          curl -sf http://localhost:8000/health | python3 -c "
          import sys, json; d=json.load(sys.stdin)
          assert d['status']=='ok'
          assert d['checkpoint_exists']==True
          print(f'PASS: /health — {d[\"model_name\"]} checkpoint_exists={d[\"checkpoint_exists\"]}')"

      - name: Test GET /model-info
        run: |
          curl -sf http://localhost:8000/model-info | python3 -c "
          import sys, json; d=json.load(sys.stdin)
          assert d['checkpoint_exists']==True
          print(f'PASS: /model-info — {d[\"model_name\"]}')"

      - name: Test security hardening
        run: |
          S=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/docs)
          [ "$S" = "404" ] && echo "PASS: /docs disabled in production image" || (echo "FAIL: /docs $S" && exit 1)

          U=$(docker exec dental-api id -u)
          [ "$U" != "0" ] && echo "PASS: container runs as uid $U" || (echo "FAIL: container runs as root" && exit 1)

          S=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/predict \
            -F "file=@frontend/public/exemple-radio.jpg" -F "image_size=10000")
          [ "$S" = "422" ] && echo "PASS: out-of-range image_size rejected" || (echo "FAIL: image_size $S" && exit 1)

          H=$(curl -s -o /dev/null -D - -X OPTIONS http://localhost:8000/predict \
            -H "Origin: https://evil.example" -H "Access-Control-Request-Method: POST" | grep -ci "access-control-allow-origin" || true)
          [ "$H" = "0" ] && echo "PASS: unknown origin refused by CORS" || (echo "FAIL: CORS open" && exit 1)

      - name: Test POST /predict (vraie radio)
        run: |
          S=$(curl -s -o /tmp/pr.json -w "%{http_code}" -X POST http://localhost:8000/predict             -F "file=@frontend/public/exemple-radio.jpg" -F "image_size=832" -F "conf_threshold=0.15")
          [ "$S" = "200" ] || (echo "FAIL: POST /predict $S" && cat /tmp/pr.json && exit 1)
          python3 -c "
          import json; d=json.load(open('/tmp/pr.json'))
          assert isinstance(d['detections'], list)
          print(f'PASS: POST /predict — {d[\"num_detections\"]} detections')"

      - name: Container logs
        if: always()
        run: docker logs dental-api

      - name: Cleanup
        if: always()
        run: docker rm -f dental-api || true

  # ── Job 4 : Publication de l'image testée sur GitHub Container Registry ────
  publish:
    name: Publish Image (ghcr.io)
    runs-on: ubuntu-latest
    needs: [build, integration-tests]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ needs.build.outputs.image_tag }}
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/docker-image.tar.gz

      - name: Image reference
        id: ref
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=ghcr.io/${OWNER}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/${OWNER}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}" >> $GITHUB_OUTPUT

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker tag ${{ env.IMAGE_NAME }}:latest ${{ steps.ref.outputs.image }}
          docker tag ${{ env.IMAGE_NAME }}:latest ${{ steps.ref.outputs.repo }}:latest
          docker push ${{ steps.ref.outputs.image }}
          docker push ${{ steps.ref.outputs.repo }}:latest

  # ── Job 5 : Déploiement sur Azure Container Apps (scale-to-zero) ───────────
  # Actif dès que la variable AZURE_CONTAINERAPP et le secret AZURE_CREDENTIALS
  # sont configurés dans le repo (voir docs/deployment.md).
  deploy-azure:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ vars.AZURE_CONTAINERAPP != '' }}

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update container image
        # min-replicas reste à 0 : la nouvelle révision retombe à zéro replica
        # tant que personne n'appelle l'API.
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINERAPP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.publish.outputs.image }}" \
            --query "properties.latestRevisionName" -o tsv

  # ── Job 6 : Vérification du frontend (ne réveille pas le backend) ──────────
  verify-frontend:
    name: Verify Frontend
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - name: Check Vercel frontend
        run: |
          S=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.FRONTEND_URL }})
          [ "$S" = "200" ] && echo "PASS: Vercel frontend online" || (echo "FAIL: $S" && exit 1)

  # ── Job 7 : Résumé final ──────────────────────────────────────────────────
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, build, integration-tests, publish, deploy-azure, verify-frontend]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "=================================================="
          echo "   DENTAL DETECTION — CI/CD PIPELINE SUMMARY"
          echo "=================================================="
          echo "  Unit Tests         : ${{ needs.unit-tests.result }}"
          echo "  Build Image        : ${{ needs.build.result }}"
          echo "  Integration Tests  : ${{ needs.integration-tests.result }}"
          echo "  Publish (ghcr.io)  : ${{ needs.publish.result }}"
          echo "  Deploy Azure       : ${{ needs.deploy-azure.result }}"
          echo "  Frontend Check     : ${{ needs.verify-frontend.result }}"
          echo ""
          if [ "${{ needs.unit-tests.result }}" = "success" ] && \
             [ "${{ needs.build.result }}" = "success" ] && \
             [ "${{ needs.integration-tests.result }}" = "success" ] && \
             [ "${{ needs.publish.result }}" = "success" ] && \
             [ "${{ needs.deploy-azure.result }}" != "failure" ] && \
             [ "${{ needs.verify-frontend.result }}" = "success" ]; then
            echo "  STATUS : ALL GREEN ✓"
            echo "  Frontend : ${{ env.FRONTEND_URL }}"
            echo "=================================================="
            exit 0
          else
            echo "  STATUS : PIPELINE FAILED ✗"
            echo "=================================================="
            exit 1
          fi
