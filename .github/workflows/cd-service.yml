name: CD — Build, Test & Deploy

on:
  push:
    branches: ["main", "master"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: dental-detection-api
  RAILWAY_URL: https://detectiondentairemlops-production.up.railway.app

jobs:
  # ── Job 1 : Tests unitaires (garde du CD) ─────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ci-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: ${{ runner.os }}-pip-ci-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e .

      - name: Run unit tests
        run: |
          pytest \
            tests/test_config.py \
            tests/test_paths.py \
            tests/test_remap.py \
            tests/test_label_parser.py \
            tests/test_registry_utils.py \
            tests/test_api.py \
            -v --tb=short

      - name: Verify CLIs
        run: |
          python scripts/serve_api.py --help
          python scripts/register_best_model.py --help

  # ── Job 2 : Build Docker (dépend de unit-tests) ───────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: unit-tests
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image artifact
        run: docker save ${{ env.IMAGE_NAME }}:latest | gzip > /tmp/docker-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ steps.meta.outputs.version }}
          path: /tmp/docker-image.tar.gz
          retention-days: 1

  # ── Job 3 : Tests d'intégration (dépend de build) ────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ needs.build.outputs.image_tag }}
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/docker-image.tar.gz

      - name: Start service container
        run: |
          docker run -d --name dental-api -p 8000:8000 ${{ env.IMAGE_NAME }}:latest

      - name: Wait for service ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health > /dev/null 2>&1 && echo "Ready after ${i}s" && break
            sleep 2
          done

      - name: Test GET /
        run: |
          curl -sf http://localhost:8000/ | python3 -c "
          import sys, json; d=json.load(sys.stdin)
          assert 'message' in d; print('PASS: GET /')"

      - name: Test GET /health
        run: |
          curl -sf http://localhost:8000/health | python3 -c "
          import sys, json; d=json.load(sys.stdin)
          assert d['status']=='ok'
          assert d['checkpoint_exists']==True
          print(f'PASS: /health — {d[\"model_name\"]} checkpoint_exists={d[\"checkpoint_exists\"]}')"

      - name: Test GET /model-info
        run: |
          curl -sf http://localhost:8000/model-info | python3 -c "
          import sys, json; d=json.load(sys.stdin)
          assert d['checkpoint_exists']==True
          print(f'PASS: /model-info — {d[\"model_name\"]}')"

      - name: Test GET /docs
        run: |
          S=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/docs)
          [ "$S" = "200" ] && echo "PASS: /docs" || (echo "FAIL: $S" && exit 1)

      - name: Test POST /predict
        run: |
          python3 -c "
          import base64,os; os.makedirs('tests/fixtures',exist_ok=True)
          open('tests/fixtures/test.jpg','wb').write(base64.b64decode(''))
          "
          S=$(curl -s -o /tmp/pr.json -w "%{http_code}" -X POST \
            http://localhost:8000/predict -F "file=@tests/fixtures/test.jpg")
          cat /tmp/pr.json
          ([ "$S" = "200" ] || [ "$S" = "500" ]) && echo "PASS: POST /predict ($S)" || (echo "FAIL: $S" && exit 1)

      - name: Container logs
        if: always()
        run: docker logs dental-api

      - name: Cleanup
        if: always()
        run: docker rm -f dental-api || true

  # ── Job 4 : Vérification production (dépend integration-tests) ────────────
  verify-production:
    name: Verify Production
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - name: Check Railway backend
        run: |
          curl -sf ${{ env.RAILWAY_URL }}/health | python3 -c "
          import sys, json; d=json.load(sys.stdin)
          assert d['status']=='ok'
          assert d['checkpoint_exists']==True
          print(f'PASS: Railway — {d[\"model_name\"]} online')"

      - name: Check Vercel frontend
        run: |
          S=$(curl -s -o /dev/null -w "%{http_code}" https://detection-dentaire-mlops.vercel.app)
          [ "$S" = "200" ] && echo "PASS: Vercel frontend online" || (echo "FAIL: $S" && exit 1)

  # ── Job 5 : Résumé final ───────────────────────────────────────────────────
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, build, integration-tests, verify-production]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "=================================================="
          echo "   DENTAL DETECTION — CI/CD PIPELINE SUMMARY"
          echo "=================================================="
          echo "  Unit Tests         : ${{ needs.unit-tests.result }}"
          echo "  Build Image        : ${{ needs.build.result }}"
          echo "  Integration Tests  : ${{ needs.integration-tests.result }}"
          echo "  Production Check   : ${{ needs.verify-production.result }}"
          echo ""
          if [ "${{ needs.unit-tests.result }}" = "success" ] && \
             [ "${{ needs.build.result }}" = "success" ] && \
             [ "${{ needs.integration-tests.result }}" = "success" ] && \
             [ "${{ needs.verify-production.result }}" = "success" ]; then
            echo "  STATUS : ALL GREEN ✓"
            echo "  Frontend : https://detection-dentaire-mlops.vercel.app"
            echo "  Backend  : ${{ env.RAILWAY_URL }}"
            echo "  API Docs : ${{ env.RAILWAY_URL }}/docs"
            echo "=================================================="
            exit 0
          else
            echo "  STATUS : PIPELINE FAILED ✗"
            echo "=================================================="
            exit 1
          fi
