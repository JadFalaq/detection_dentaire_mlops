name: CI — Tests et Vérifications

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Tests unitaires Python ─────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ci-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: ${{ runner.os }}-pip-ci-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e .

      - name: Run unit tests
        run: |
          pytest \
            tests/test_config.py \
            tests/test_paths.py \
            tests/test_remap.py \
            tests/test_label_parser.py \
            tests/test_registry_utils.py \
            tests/test_api.py \
            -v --tb=short

      - name: Verify service CLI
        run: python scripts/serve_api.py --help

      - name: Verify registry CLI
        run: python scripts/register_best_model.py --help

  # ── Lint frontend ──────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend (production)
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://detectiondentairemlops-production.up.railway.app
