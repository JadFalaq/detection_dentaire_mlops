experiment:
  name: yolov8s_7classes_ext_generalization_v1

model:
  type: yolov8
  variant: models/checkpoints/yolov8s_7classes_baseline/weights/best.pt

training:
  image_size: 896
  epochs: 40
  batch_size: 2
  device: 0
  workers: 0
  optimizer: AdamW
  lr0: 0.00035
  lrf: 0.01
  patience: 18
  pretrained: true
  cache: false
  verbose: true
  cos_lr: true
  weight_decay: 0.0007
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  close_mosaic: 10
  multi_scale: true
  amp: true
  save_period: 10
  seed: 42
  deterministic: true

augmentation:
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.12
  degrees: 1.5
  translate: 0.03
  scale: 0.15
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 0.15
  mixup: 0.0

outputs:
  project_dir: models/checkpoints
  run_name: yolov8s_7classes_ext_generalization_v1
