[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detection-dentaire-mlops"
version = "0.1.0"
description = "Projet MLOps de detection d anomalies dentaires sur radiographies panoramiques"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jad Falaq" }
]
dependencies = [
    "numpy>=1.26,<2.1",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "opencv-python>=4.9",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "ultralytics>=8.2",
    "mlflow>=2.12",
    "dvc>=3.50",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
